<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いのちの1万年すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--sub:#5a6b74;--line:#e2e8ee;--accent:#23905c;--accent2:#176b43;--bad:#c0392b;--rx:46deg;--ground:#cfe7a6;--ground2:#b6d98a;--sky1:#bfe6ff;--sky2:#8fc9f0}
*{box-sizing:border-box}
body{margin:0;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.6;background:radial-gradient(ellipse at 50% 30%,var(--sky1),var(--sky2)) fixed;min-height:100vh;overflow-x:hidden;transition:background 1.5s}
header{background:linear-gradient(90deg,#8a5a2b,#1f8a57,#2a9fc9);color:#fff;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative;z-index:5}
header h1{font-size:1.08rem;margin:0;letter-spacing:.05em}
.hbtn{background:rgba(255,255,255,.22);box-shadow:none;padding:3px 12px;font-size:.85rem;border-radius:999px}
.hbtn:active{transform:none;box-shadow:none}
main{max-width:1440px;margin:0 auto;padding:8px}
.card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 0 rgba(30,60,80,.12),0 10px 24px rgba(30,60,80,.1);animation:pop .35s both}
.hero{text-align:center}.hero h2{font-size:1.8rem;color:#1f7a4d;margin:4px 0}
.hero .icons{font-size:44px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.hero .icons span{animation:float 3s ease-in-out infinite;display:inline-block}
.hero .icons span:nth-child(2n){animation-delay:.6s}.hero .icons span:nth-child(3n){animation-delay:1.2s}
h2{font-size:1.15rem;margin:4px 0 10px}
button{font:inherit;border:none;border-radius:14px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer;font-weight:800;box-shadow:0 5px 0 var(--accent2);transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
button.sub{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:0 5px 0 #bfe3cf}
button:disabled{background:#b7c2bc;box-shadow:0 5px 0 #98a49d;cursor:not-allowed;color:#eef}
button.big{font-size:1.15rem;padding:13px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nbtn{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);min-width:60px;font-size:1.05rem}
.nbtn.sel{border-color:var(--accent);background:#e7f7ee;box-shadow:0 4px 0 var(--accent)}
select,.prow input{font:inherit;padding:7px;border:2px solid #cbd6dc;border-radius:10px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line)}
.prow input{width:210px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;flex:none;font-size:.85rem}
ul.rules li{margin-bottom:3px}
.small{font-size:.85rem;color:var(--sub)}
.etl{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px}.etl span{background:#f4efe4;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
/* ===== 盤面 ===== */
.game{display:grid;grid-template-columns:1fr 320px;gap:8px;align-items:start}
@media(max-width:960px){.game{grid-template-columns:1fr}}
.stage{position:relative;height:calc(100vh - 62px);min-height:470px;overflow:hidden;border-radius:20px;background:linear-gradient(var(--sky1),var(--sky2) 70%);transition:background 1.5s}
.cam{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 15%}
.tilt{position:absolute;left:50%;top:62%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) scale(var(--z,1))}
.map{position:absolute;left:0;top:0;width:1820px;height:1220px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.map>svg{position:absolute;left:0;top:0}
.board-base{position:absolute;left:-30px;top:-30px;width:1880px;height:1280px;border-radius:40px;background:linear-gradient(135deg,#8a5a34,#6b4226);box-shadow:0 26px 0 #4a2d18;transform:translateZ(-2px)}
.nd{position:absolute;transform:translate(-50%,-50%);transform-style:preserve-3d}
.sq{width:64px;height:64px;border-radius:14px;color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.5);line-height:1.05}
.sq .si{font-size:24px}.sq .sl{font-size:10px;margin-top:2px;white-space:nowrap}
.sq.G{background:#3bb36b}.sq.B{background:#e2483a}.sq.Q{background:#9b5fd6}.sq.K{background:#f2b81c;color:#5a3d00}.sq.C{background:#5b3a7a}
.sq.H{background:linear-gradient(#ffd34d,#f0a500);color:#5a3d00}.sq.P{background:#2a6fd6;width:84px;height:84px;border-radius:50%;border:5px solid #fff}
.sq.S,.sq.E{background:linear-gradient(135deg,#fff8d0,#ffcf4d);color:#7a4b00;width:96px;height:80px}
.sq.P .si{font-size:26px}.sq.S .si,.sq.E .si{font-size:30px}
.nd.cand .sq{animation:candp .7s infinite alternate}
.nd.lit .sq{box-shadow:0 0 0 6px #ffd34d,0 0 30px 10px #fff3a8}
.bb{position:absolute;transform-style:preserve-3d}
.bb>.up{position:absolute;left:0;bottom:0;transform:translateX(-50%) rotateX(calc(-1 * var(--rx)));transform-origin:50% 100%;white-space:nowrap}
.deco>.up{font-size:var(--fs,40px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.deco.sway>.up{animation:sway 3s ease-in-out infinite alternate}
.deco.pop>.up{animation:popup .9s both}
.stopsign>.up{background:#e2483a;color:#fff;font-weight:800;font-size:15px;padding:2px 12px;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.fork>.up{background:#fff;color:#2a6fd6;font-weight:800;font-size:14px;padding:2px 10px;border-radius:10px;border:3px solid #2a6fd6}
.pawn{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .26s ease,top .26s ease}
.pawn .psh{position:absolute;width:34px;height:14px;left:-17px;top:-7px;border-radius:50%;background:rgba(0,0,0,.3)}
.pawn .pst{position:absolute;left:-22px;bottom:0;width:44px;transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--rx)));display:flex;flex-direction:column;align-items:center}
.pawn .phop{display:flex;flex-direction:column;align-items:center;position:relative}
.pawn .pbody{width:42px;height:42px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 3px 0 rgba(0,0,0,.25);position:relative}
.pawn .pbody b{position:absolute;right:-8px;top:-8px;background:var(--c);color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pawn .pegs{display:flex;gap:2px;margin-top:-2px;height:9px}.pawn .pegs i{width:8px;height:8px;border-radius:50%;background:var(--c);border:1px solid #fff}
.pawn .pbase{width:30px;height:12px;margin-top:-1px;background:var(--c);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);border-radius:0 0 6px 6px;filter:brightness(.8)}
.pawn .pchar{position:absolute;top:-34px;left:26px;font-size:30px;animation:bob .6s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.pawn.cur .pbody{box-shadow:0 0 0 4px #fff,0 0 18px 7px var(--c)}
.pawn.cur .phop{animation:bob .8s ease-in-out infinite alternate}
.pawn.hop .phop{animation:hop .26s ease-out}
.pawn.done{opacity:.8}
/* HUD */
.hud{position:absolute;left:10px;right:10px;top:8px;z-index:4;pointer-events:none}
.hud .box{background:rgba(255,255,255,.95);border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.eras{display:flex;gap:3px}
.eras span{flex:1;text-align:center;font-size:.72rem;font-weight:800;padding:2px 0;border-radius:8px;background:#eee;color:#888;white-space:nowrap;overflow:hidden}
.eras span.past{background:#d9efe0;color:#2f6b4f}.eras span.now{background:#ffd34d;color:#5a3d00;box-shadow:0 0 0 2px #f0a500;transform:scale(1.06)}
.mbar{height:12px;background:#e3e9ec;border-radius:999px;overflow:hidden;position:relative;margin-top:4px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#b08a5a,#8bd36a,#4aa3df,#b06ad9);transition:width .9s}
.mbar span{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9)}
.hrow{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.88rem;flex-wrap:wrap}
.chips span{display:inline-block;background:#f3e9fb;border:2px solid #c7a6e6;border-radius:999px;padding:0 8px;margin-left:4px;font-size:.78rem}
/* サイド */
.side .turn{background:#fff;border-radius:18px;padding:10px 12px;border:5px solid;box-shadow:0 6px 0 rgba(30,60,80,.12);margin-bottom:8px;text-align:center}
.tname{font-size:1.15rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.money{font-size:1.35rem;font-weight:800;color:#8a5a00}.money.neg{color:var(--bad)}
.tsub{color:var(--sub);font-size:.85rem;margin-bottom:6px}
#spin{width:100%;font-size:1.2rem;padding:12px;background:linear-gradient(#ff9f2e,#ff7a1a);box-shadow:0 6px 0 #c4520a}
#spin:not(:disabled){animation:pulse 1.4s infinite}
.hand{margin-top:8px;text-align:left}
.cardc{display:flex;gap:6px;align-items:center;background:#eef6fd;border:2px solid #9cc8ef;border-radius:10px;padding:4px 9px;margin-top:5px;font-weight:700;font-size:.86rem;cursor:pointer;width:100%;color:var(--ink);box-shadow:none;text-align:left}
.cardc:active{transform:none;box-shadow:none}.cardc span{font-size:1.2rem}.cardc.new{animation:glow 1.2s 2}
.branch{margin-top:8px}.branch button{width:100%;margin-top:6px;text-align:left;background:#fff;color:var(--ink);border:3px solid #2a6fd6;box-shadow:0 4px 0 #9cc8ef;font-size:.92rem}
.plist{background:#fff;border-radius:18px;padding:6px 10px;box-shadow:0 6px 0 rgba(30,60,80,.12);margin-bottom:8px}
.pr{display:grid;grid-template-columns:24px 1fr 80px 64px 26px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.pr:last-child{border-bottom:none}.pr.now{background:#fffbea;border-radius:8px}
.pr .pn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.pr .pm{text-align:right;font-weight:800;color:#8a5a00}.pr .pm.neg{color:var(--bad)}
.eracard{background:#fffaf0;border-radius:18px;padding:8px 12px;box-shadow:0 6px 0 rgba(30,60,80,.12);font-size:.85rem}
.eracard b{font-size:1rem}
/* ルーレット */
.rlov{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(10,20,40,.3)}
.rlov.hidden{display:none}
.rlwrap{position:relative;width:300px;height:300px;animation:zoomin .4s both}
.rlwrap .ptr{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:44px;color:#e2483a;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.rlwrap svg{width:300px;height:300px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.rlres{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:800;color:#fff;text-shadow:0 6px 0 #ff7a1a,0 0 30px rgba(0,0,0,.4);z-index:46}
.rlres span{display:block;animation:starpop .5s both}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(20,30,40,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.hidden{display:none}
.mbox{background:#fff;border-radius:22px;padding:18px 22px;max-width:640px;width:100%;max-height:94vh;overflow:auto;text-align:center;border:5px solid #9cc8ef;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:zoomin .35s cubic-bezier(.2,.9,.3,1.3) both}
.mbox.warn{border-color:#f08a3a}.mbox.good{border-color:#4cc38a}.mbox.quiz{border-color:#9b78d6}.mbox.gold{border-color:#f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.mbox.dark{background:radial-gradient(circle at 50% 0,#3b2c4a,#140f1c);color:#eee;border-color:#6a4a8a}
.mbox.era{max-width:720px;border:none;padding:0;background:#f7ecd2;overflow:hidden}
.eratop{padding:18px;color:#fff;background:linear-gradient(135deg,var(--ec1),var(--ec2))}
.eratop .ei{font-size:70px;line-height:1.1;animation:starpop .7s both}.eratop h2{font-size:2rem;margin:4px 0;letter-spacing:.1em}.eratop small{font-size:1rem;opacity:.95}
.erabody{padding:14px 22px 18px;text-align:left;background:repeating-linear-gradient(0deg,#f7ecd2 0 28px,#f2e3c2 28px 29px)}
.erabody li{margin-bottom:4px}
.micon{font-size:60px;line-height:1.2;animation:starpop .5s both}
.mbox h2{font-size:1.35rem;margin:4px 0 8px}
.mbody{font-size:1.02rem}
.memo{font-size:.9rem;color:var(--sub);background:#f4f7f9;border-radius:10px;padding:8px 12px;text-align:left;margin:10px 0 0}
.mbox.dark .memo{background:rgba(255,255,255,.08);color:#ddd}
.mbtns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.mbox.era .mbtns{padding:0 22px 18px;margin:0;background:#f7ecd2}
.mbtns button{width:100%}
.mbtns.choices button{background:#fff;color:var(--ink);border:3px solid #b79ee0;box-shadow:0 4px 0 #d9ccf0;text-align:left}
.ng{color:var(--bad);font-weight:800}.okc{color:#1a8a4d;font-weight:800}
.qprog{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.qprog span{width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;background:#f6fbf8;border:3px solid #8bc34a;border-radius:14px;padding:10px 14px;margin:8px 0}
.pcard .pi{font-size:44px}.pcard b{font-size:1.05rem}
.bigcard{width:200px;height:270px;margin:6px auto 4px;perspective:900px}
.bigcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip 1s .15s cubic-bezier(.3,.8,.3,1.1) both}
.bigcard .bk,.bigcard .fr{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bigcard .bk{background:repeating-linear-gradient(45deg,#b08a5a 0 12px,#1f8a57 12px 24px);color:#fff;font-size:64px;border:6px solid #fff}
.bigcard .fr{background:linear-gradient(160deg,#fff,#fff6e0);border:6px solid #f0a500;transform:rotateY(180deg);padding:12px}
.bigcard .fr .ci{font-size:74px;line-height:1.1}.bigcard .fr .cn{font-weight:800;font-size:1.1rem;margin-top:8px}
.bigcard .fr .ct{font-size:.72rem;color:#b07800;font-weight:800;letter-spacing:.1em}
.charbig{font-size:110px;line-height:1;display:inline-block;animation:charin 1s cubic-bezier(.2,.9,.3,1.3) both}
.charfly{font-size:110px;display:inline-block;animation:charout 1.1s ease-in both}
.say{display:inline-block;background:#fff;color:#22313a;border-radius:16px;padding:6px 16px;font-weight:800;margin:6px 0}
/* 演出 */
.fxl{position:fixed;inset:0;pointer-events:none;z-index:44;overflow:hidden}
.tint{position:fixed;inset:0;pointer-events:none;z-index:43;opacity:0}
.tint.on{animation:tint var(--d,1.6s) ease both}
.pt{position:absolute;line-height:1}
.pt.fall{animation:fallp var(--d) linear var(--dl) both}
.pt.rain{width:2px;height:22px;background:linear-gradient(transparent,rgba(220,235,255,.95));animation:rainf var(--d) linear var(--dl) both}
.pt.rise{animation:risep var(--d) ease-out var(--dl) both}
.pt.crawl{animation:crawl var(--d) linear var(--dl) both}
.pt.burst,.pt.fw{animation:burst var(--d) cubic-bezier(.2,.8,.3,1) var(--dl) both}
.pt.burst{left:50%;top:50%}
.pt.drift{animation:drift var(--d) ease-in-out var(--dl) both}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:47}
.banner div{background:#fff;padding:12px 44px;border-radius:22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.2);animation:banner var(--bd,1.5s) cubic-bezier(.2,.8,.3,1) both;border:5px solid var(--c,#23905c)}
.banner b{display:block;font-size:1.9rem;color:var(--c,#23905c);line-height:1.3}
.banner small{font-size:1rem;color:var(--sub)}
.floatm{position:fixed;z-index:48;font-weight:800;font-size:1.6rem;pointer-events:none;animation:floatm 1.6s ease-out both;text-shadow:0 2px 0 #fff,0 0 8px #fff}
.shake{animation:hit .55s}
.warp{position:fixed;inset:0;z-index:49;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,230,150,.6) 40%,transparent 70%);animation:warp 1.6s ease both}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fallc linear forwards;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:#eef5f1}
.rf{border:4px solid;border-radius:16px;padding:10px 14px;margin:12px 0;background:#fff}
.rfh{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin-bottom:6px}.rfok{margin-left:auto;color:#1a8a4d;font-weight:800}
.rf input{font:inherit;padding:7px;border:2px solid #cbd6dc;border-radius:10px;width:220px}
.rfq{margin-top:8px;font-size:.95rem}.rfq textarea{display:block;width:100%;font:inherit;padding:8px;border:2px solid #cbd6dc;border-radius:10px;margin-top:4px;resize:vertical}
.cnt{text-align:right;font-size:.82rem;font-weight:700}
.qcard{border:4px solid #f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.qcard li{margin-bottom:6px;font-size:1.03rem}
.score{font-size:2.2rem;font-weight:800;color:#1f7a4d}
.trophy{font-size:80px;display:inline-block;animation:spinY 2.4s ease-in-out infinite}
footer{text-align:center;color:#eaf6ff;font-size:.78rem;padding:6px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-28px) scale(1.05)}100%{transform:translateY(0)}}
@keyframes sway{from{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) rotate(-4deg)}to{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) rotate(4deg)}}
@keyframes popup{0%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(0)}70%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(1.4)}100%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(1)}}
@keyframes candp{from{box-shadow:0 0 0 3px #fff}to{box-shadow:0 0 0 9px #2a6fd6,0 0 22px 6px #9cd8f5}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.04)}}
@keyframes glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px #ffd34d,0 0 14px #ffd34d}}
@keyframes starpop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes flip{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(180deg) scale(1)}}
@keyframes tint{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes fallp{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(var(--r,360deg))}}
@keyframes rainf{from{transform:translate(0,-12vh) rotate(12deg)}to{transform:translate(-18vw,112vh) rotate(12deg)}}
@keyframes risep{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-70vh) scale(1.2);opacity:0}}
@keyframes crawl{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}

 $('mwrap').innerHTML=raw?`<div class="mbox ${cls||''}">${raw}<div class="mbtns">${buttons.map((b,i)=>`<button data-b="${i}" class="${b.cls||''}" ${b.dis?'disabled':''}>${b.label}</button>`).join('')}</div></div>`
  :`<div class="mbox ${cls||''}">${icon?`<div class="micon">${icon}</div>`:''}<h2>${title}</h2><div class="mbody">${body||''}</div><div class="mbtns ${choices?'choices':''}">${buttons.map((b,i)=>`<button data-b="${i}" class="${b.cls||''}" ${b.dis?'disabled':''}>${b.label}</button>`).join('')}</div></div>`;
 ov.classList.remove('hidden');
 $('mwrap').querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{ov.classList.add('hidden');res(buttons[+el.dataset.b].v);});});}
const OK={label:'OK ▶',v:1};
async function askQ(q,head){const idx=shuffle(q.a.map((a,i)=>i));
 const v=await modal({icon:'❓',cls:'quiz',choices:true,title:q.q,body:`${head||''}<span class="small">班のみんなで相談してOK！</span>`,buttons:idx.map(i=>({label:q.a[i],v:i}))});
 const ok=v===q.k;sfx(ok?'good':'bad');if(ok)particles({kind:'burst',e:['⭕','✨'],n:10,d:1,fs:28});else shake();
 await modal({icon:ok?'⭕':'❌',cls:ok?'good':'quiz',title:ok?'正解！':'ざんねん…',body:`答え：<b>${q.a[q.k]}</b><p class="memo">${q.m}</p>`,buttons:[{label:'次へ ▶',v:1}]});return ok;}
async function test3(qs,title){let n=0;const res=[];
 for(let i=0;i<qs.length;i++){const head=`<div class="qprog">${qs.map((_,j)=>`<span style="background:${j<i?(res[j]?'#c8f0d6':'#f8d3cf'):j===i?'#ffe48a':'#eee'}">${j<i?(res[j]?'⭕':'❌'):j+1}</span>`).join('')}</div><b>${title} ${i+1}問目</b><br>`;
  const ok=await askQ(qs[i],head);res.push(ok);if(ok)n++;}
 return n;}

const E=()=>ERAS[G.era];

const assets=p=>p.money+p.props.reduce((a,x)=>a+x.price,0)+p.mates*MATE;
function cardsUpTo(){const L=[];ERAS.forEach((e,ei)=>{if(ei<=G.era)e.cards.forEach(c=>{for(let k=0;k<(ei===G.era?4:1);k++)L.push({...c,era:ei});});});return L;}

 (G.short?`<div class="bb stopsign" style="left:${NODES[G.start].x}px;top:${NODES[G.start].y-44}px"><div class="up" style="background:#2a6fd6">スタート</div></div>`:'')+`<div id="pawns"></div>`;
 setDeco(false);}

 <div class="eracard">${e.i} <b>${e.n}の生物育成</b><br>${e.sum}</div>`;
 if($('spin'))$('spin').onclick=spin;

/* ===== 発展度と時代 ===== */
async function addDev(v,why){G.dev=Math.max(0,G.dev+v);renderHud();
 while(G.era<6&&devPct()>=ETH[G.era+1]){G.era++;await eraUp(why);}}
async function eraUp(why){const e=E();sfx('era');
 const w=document.createElement('div');w.className='warp';document.body.appendChild(w);setTimeout(()=>w.remove(),1700);
 await sleep(RM?50:700);applyEra();setDeco(true);renderPawns();renderHud();renderSide();fireworks(5);confetti(60);
 G.P.forEach(p=>{const c=pick(e.cards);if(p.cards.length<HAND)p.cards.push({...c,era:G.era});});
 await eraModal(false,why);renderSide();}
async function eraModal(first,why){const e=E();
 await modal({cls:'era',raw:`<div class="eratop" style="--ec1:${e.c1};--ec2:${e.c2}"><div class="ei">${e.i}</div><small>${first?'ここから物語が始まる…':'時代が進んだ！'}</small><h2>${e.n}</h2><small>${e.y}</small></div>
  <div class="erabody">${why&&!first?`<p><b>${why}</b></p>`:''}<p><b>🌱 この時代の生物育成</b><br>${e.sum}</p><b>🔧 この時代の技術</b><ul>${e.tech.map(t=>`<li>${t}</li>`).join('')}</ul>
  ${first?'<p class="small">施設を買ったりクイズに正解したりして「発展度」を上げると、次の時代へ進みます。</p>':`<p class="okc">全員に「${e.n}」の技術カードを1枚配りました！ 収穫日の収入もアップ！</p>`}</div>`,buttons:[{label:first?'⏳ 出発！':'この時代を生きよう！ ▶',v:1}]});}

/* ===== カード ===== */
async function useCard(i){if(G.busy)return;const p=CP(),c=p.cards[i];
 const ch=G.chars.find(x=>x.h===G.cur);const can=c.t!=='guard'||!!ch;
 const v=await modal({icon:c.i,title:`${c.n}（${ERAS[c.era].n}）`,body:`<p class="memo">${c.m}</p>${can?'':'<p class="small">このカードは、ピンチやキャラクターが現れたときに使えます。</p>'}`,buttons:can?[{label:'使う',v:1},{label:'やめる',v:0,cls:'sub'}]:[{label:'とじる',v:0,cls:'sub'}]});
 if(!v)return;p.cards.splice(i,1);
 if(c.t==='spin2'){p.spin2=true;sfx('card');await banner(`${c.i} ルーレット2回！`,'',p.color,1100);}
 else if(c.t==='income'){const g=E().base*3;p.money+=g;sfx('coin');renderSide();floatMoney(g);await modal({icon:c.i,cls:'good',title:`${c.n}で +${fmt(g)}`,body:c.m,buttons:[OK]});}
 else if(c.t==='meter'){sfx('good');particles({kind:'burst',e:[c.i,'✨'],n:14,d:1.2,fs:30});await modal({icon:c.i,cls:'good',title:`${c.n}で班の発展度アップ！`,body:c.m,buttons:[OK]});await addDev(6,`${esc(p.name)}さんの「${c.n}」で技術が進んだ！`);}
 else if(c.t==='guard'&&ch)await repelChar(ch,c);
 renderSide();}
async function getCard(p,title,icon){const c=pick(cardsUpTo());sfx('card');
 const big=`<div class="bigcard"><div class="in"><div class="bk">🃏</div><div class="fr"><div class="ct">${ERAS[c.era].n}の技術</div><div class="ci">${c.i}</div><div class="cn">${c.n}</div></div></div></div><p class="memo">${c.m}</p>`;
 if(p.cards.length<HAND){await modal({icon,title,body:big,buttons:[{label:'手札に加える ▶',v:1}]});p.cards.push(c);renderSide(true);return;}
 const all=[...p.cards,c];const v=await modal({icon,title,body:`${big}カードは${HAND}枚までです。<b>1枚すてる</b>カードを選ぼう。`,buttons:all.map((x,i)=>({label:`${x.i} ${x.n}をすてる${i===all.length-1?'（新しいカード）':''}`,v:i,cls:'sub'}))});
 all.splice(v,1);p.cards=all;renderSide();}

/* ===== ターン ===== */
async function turnStart(){const p=CP();G.busy=false;focus(p.node);renderPawns();renderSide();renderHud();
 await banner(`${E().veh} ${esc(p.name)}さんの番！`,`💰 ${fmt(p.money)} ・ ${E().n}`,p.color,1200);}
async function spin(){if(G.busy)return;G.busy=true;renderSide();const p=CP();
 let n=await spinWheel();if(p.spin2){p.spin2=false;const n2=await spinWheel();n+=n2;await banner(`合計 ${n}マス！`,'',p.color,900);}
 const r=await move(p,n);
 if(!p.done){$('nd'+p.node).classList.add('lit');await sleep(250);await land(p,NODES[p.node]);$('nd'+p.node).classList.remove('lit');await charTurn(p);}
 await endTurn();}
async function move(p,steps){let moved=false;
 for(let s=steps;s>0;s--){const opts=NX[p.node];if(!opts.length)break;
  let nx=opts[0];if(opts.length>1)nx=await chooseFork(p,s);
  p.node=nx;focus(nx);renderPawns(G.cur);sfx('hop');await sleep(RM?60:280);
  const t=NODES[nx].t;
  if(t==='H'&&s>1)await harvest(p,true);
  const ch=G.chars.find(c=>c.h===G.cur);const other=G.P.findIndex((q,i)=>i!==G.cur&&!q.done&&q.node===nx);
  if(ch&&other>=0&&!moved){moved=true;ch.h=other;renderPawns();renderHud();sfx('boss');await banner(`${CHARS[ch.k].i} ${CHARS[ch.k].n}が ${esc(G.P[other].name)}さんに うつった！`,'追いこすと、キャラクターがうつります',G.P[other].color,1400);renderSide();}
  if(t==='E'){await goal(p);return'goal';}
  if(t==='P'&&s>1){await banner('🛑 止まれ！','チャンスマスでは必ず止まります','#e2483a',1100);break;}}
 return'';}
function chooseFork(p,left){const f=FORKS.find(x=>x.at===p.node);return new Promise(res=>{const br=$('branch');
 [f.short,f.long].forEach(o=>$('nd'+o).classList.add('cand'));
 const done=v=>{[f.short,f.long].forEach(o=>$('nd'+o).classList.remove('cand'));br.innerHTML='';res(v);};
 br.innerHTML=`<b>🔀 分かれ道！ のこり${left}マス</b><button id="fs">⚡ 近道<br><span class="small">早く進めるけど、ピンチが多め</span></button><button id="fl">🌈 遠回り<br><span class="small">長いけど、収穫日やカードが多め</span></button>`;
 $('fs').onclick=()=>done(f.short);$('fl').onclick=()=>done(f.long);});}

/* ===== マスの出来事 ===== */
async function land(p,nd){const t=nd.t;
 if(t==='H')return harvest(p,false);if(t==='G')return good(p);if(t==='B')return bad(p);if(t==='Q')return quizSq(p);if(t==='K')return getCard(p,'技術カードを手に入れた！','🃏');if(t==='C')return charSq(p);if(t==='P')return chance(p);}
async function harvest(p,pass){const e=E(),inc=e.base+p.props.reduce((a,x)=>a+x.inc,0);p.money+=inc;sfx('coin');renderSide();floatMoney(inc);
 particles({kind:'rise',e:['🌾','💰','✨'],n:12,d:1.5,fs:30});tint('rgba(255,210,80,.25)',1000);
 if(pass){await banner(`🌾 収穫日！ +${fmt(inc)}`,'通りすぎても収入が入ります','#d49a00',1100);}
 else await modal({icon:'🌾',cls:'gold',title:`収穫日！ +${fmt(inc)}`,body:`${e.n}の基本収入 ${fmt(e.base)}＋施設の収入 ${fmt(inc-e.base)}<p class="memo">時代が進むと技術が発達し、同じ広さからとれる量がふえていきます。</p>`,buttons:[OK]});
 await addDev(1);}
async function good(p){const e=E(),ev=pick(e.good);p.money+=ev.v;if(ev.mate)p.mates+=ev.mate;sfx('good');renderSide();renderPawns();floatMoney(ev.v);
 particles({kind:'burst',e:['✨','🌟','😊'],n:16,d:1.2,fs:30});tint('rgba(80,220,140,.22)',1100);
 await modal({icon:'😊',cls:'good',title:ev.t,body:`<b class="okc" style="font-size:1.3rem">+${fmt(ev.v)}</b>${ev.mate?'<br>👤 仲間が1人ふえた！（ゴールで1人300万円）':''}${ev.dev?'<br>📈 班の発展度アップ！':''}<p class="small">${e.i} ${e.n}のできごと</p>`,buttons:[OK]});
 if(ev.dev)await addDev(ev.dev,`「${ev.t}」で技術が進んだ！`);}
async function bad(p){const e=E(),ev=pick(e.bad);let d=ev.v;await eventFx(ev.fx);
 const gi=p.cards.findIndex(c=>c.t==='guard');let note='';
 if(gi>=0){const g=p.cards[gi];const v=await modal({icon:'😣',cls:'warn',title:ev.t,body:`このままだと <b class="ng">−${fmt(d)}</b><br>${g.i} ${g.n}で防げます！ 使いますか？`,buttons:[{label:`${g.i} ${g.n}を使う`,v:1},{label:'使わない',v:0,cls:'sub'}]});
  if(v){p.cards.splice(gi,1);d=0;note=`${g.i} ${g.n}で防いだ！`;sfx('good');particles({kind:'burst',e:['🛡️','✨'],n:14,d:1,fs:30});}}
 p.money-=d;renderSide();if(d)floatMoney(-d);
 await modal({icon:'😣',cls:'warn',title:ev.t,body:`${note?`<b class="okc">${note}</b><br>`:''}${d?`<b class="ng" style="font-size:1.3rem">−${fmt(d)}</b>`:'<b class="okc">損害なし！</b>'}<p class="small">${e.i} ${e.n}のできごと</p>`,buttons:[OK]});}
async function quizSq(p){const ok=await askQ(pick(E().qs),`<b>❓ ${E().n}クイズ</b><br>`);
 if(ok){const g=E().base*2;p.money+=g;renderSide();floatMoney(g);sfx('coin');await addDev(3,'クイズに正解して、知識が広まった！');}}
async function chance(p){const e=E(),opts=e.props.filter(x=>!p.props.some(y=>y.n===x.n));
 const list=opts.map(x=>`<div class="pcard"><span class="pi">${x.i}</span><div><b>${x.n}</b><br>価格 ${fmt(x.price)}・収穫日の収入 +${fmt(x.inc)}<br><span class="small">${x.m}</span></div></div>`).join('');
 if(!opts.length)return modal({icon:'🛑',title:'チャンスマス',body:`${e.n}の施設はすべて持っています！ ボーナス +${fmt(e.base*2)}`,buttons:[OK]}).then(()=>{p.money+=e.base*2;renderSide();});
 const v=await modal({icon:'🛑',cls:'gold',title:`チャンス！ ${e.n}の施設を手に入れよう`,body:`${list}<b>産地テスト（3問中2問正解）に合格すると買えます。全問正解なら1割引！</b>`,
  buttons:[...opts.map((x,i)=>({label:`${x.i} ${x.n}（${fmt(x.price)}）に挑戦`,v:i+1,dis:p.money<x.price*.9})),{label:'今回は見送る',v:0,cls:'sub'}]});
 if(!v)return;const x=opts[v-1];
 const n=await test3(shuffle(e.qs).slice(0,3),`${e.n}テスト`);
 if(n>=2){const perfect=n===3,price=Math.round(x.price*(perfect?.9:1));p.money-=price;p.props.push({...x,era:G.era});if(perfect)p.tp++;
  sfx('fan');fireworks(3);confetti(50);renderSide();floatMoney(-price);
  await modal({icon:x.i,cls:'gold',title:`合格！「${x.n}」を手に入れた！`,body:`${n}問正解${perfect?'（全問正解で1割引！）':''}<br>支払い <b>${fmt(price)}</b><p class="memo">${x.m}<br>収穫日のたびに +${fmt(x.inc)} の収入があります。</p>`,buttons:[OK]});
  await addDev(perfect?14:10,`${esc(p.name)}さんが「${x.n}」をつくり、ムラが発展した！`);}
 else{p.tf++;sfx('bad');await modal({icon:'📚',title:`不合格…（${n}問正解）`,body:'今回は手に入りませんでした。解説を思い出して、次のチャンスで挑戦しよう！',buttons:[OK]});}}

/* ===== キャラクター ===== */
async function charSq(p){const ks=Object.keys(CHARS).filter(k=>CHARS[k].from<=G.era&&!G.chars.some(c=>c.k===k));
 if(!ks.length){return good(p);}
 let k=ks.includes('ondanka')&&Math.random()<.45?'ondanka':pick(ks.filter(x=>x!=='ondanka').length?ks.filter(x=>x!=='ondanka'):ks);
 const C=CHARS[k];sfx('boss');tint('rgba(40,0,60,.55)',2200);shake();
 if(k==='ondanka'){G.chars.push({k,h:-1,left:3});particles({kind:'rise',e:['🔥','🌡️','☀️'],n:18,d:2,fs:34});
  await modal({cls:'dark',title:'オンダンカ神様 が あらわれた！',body:`<div class="charbig">${C.i}</div><br><span class="say">「${C.say}」</span><br>いる間は、だれかの番が来るたびに<b>班の発展度</b>が下がってしまう！<p class="memo">${C.m}</p>`,buttons:[{label:'みんなで立ち向かおう！ ▶',v:1}]});
  renderHud();return ondankaChallenge();}
 G.chars.push({k,h:G.cur,left:3});
 await modal({cls:'dark',title:`${C.n} が あらわれた！`,body:`<div class="charbig">${C.i}</div><br><span class="say">「${C.say}」</span><br>${esc(p.name)}さんに とりついた！<p class="memo">${C.m}<br>追い払うには：守りの技術カード（${E().cards.filter(c=>c.t==='guard').map(c=>c.i+c.n).join('、')||'時代の守りのカード'}など）。ほかの人を追いこすと、うつることも。</p>`,buttons:[{label:'負けないぞ！ ▶',v:1}]});
 renderPawns();renderHud();renderSide();}
async function repelChar(ch,card){const C=CHARS[ch.k];G.chars=G.chars.filter(c=>c!==ch);sfx('good');particles({kind:'burst',e:['✨','💥',card.i],n:18,d:1.2,fs:32});
 await modal({cls:'good',title:`${C.n}を 追い払った！`,body:`<div class="charfly">${C.i}</div><br>${card.i} <b>${card.n}</b>の技術で撃退！<p class="memo">${C.m}</p>`,buttons:[{label:'やったー！ ▶',v:1}]});
 await addDev(3);renderPawns();renderHud();}
async function charTurn(p){const od=G.chars.find(c=>c.k==='ondanka');
 if(od){od.left-=1/G.P.length;await addDev(-1);if(od.left<=0){G.chars=G.chars.filter(c=>c!==od);await banner('🌡️ オンダンカ神様は去っていった','',' #6a4a8a',1200);}renderHud();}
 const ch=G.chars.find(c=>c.h===G.cur);if(!ch)return;const C=CHARS[ch.k];
 const gi=p.cards.findIndex(c=>c.t==='guard');
 if(gi>=0){const g=p.cards[gi];const v=await modal({cls:'dark',title:`${C.i} ${C.n}が いたずらしようとしている！`,body:`<span class="say">「${C.say}」</span><br>${g.i} ${g.n}で追い払える！`,buttons:[{label:`${g.i} 使って追い払う`,v:1},{label:'使わない',v:0,cls:'sub'}]});
  if(v){p.cards.splice(gi,1);return repelChar(ch,g);}}
 const d=Math.round(E().base*1.5+p.props.length*E().base*.3);p.money-=d;ch.left--;
 sfx('bad');shake();tint('rgba(60,0,80,.35)',1400);particles({kind:'drift',e:[C.i],n:8,d:1.4,fs:34});renderSide();floatMoney(-d);
 await modal({cls:'dark',title:`${C.i} ${C.n}の いたずら！`,body:`<span class="say">「${C.say}」</span><br><b style="color:#ff9a8a;font-size:1.3rem">−${fmt(d)}</b><p class="memo">${C.m}</p>`,buttons:[OK]});
 if(ch.left<=0){G.chars=G.chars.filter(c=>c!==ch);await banner(`${C.i} ${C.n}は去っていった`,'',' #6a4a8a',1200);renderPawns();renderHud();}}
async function ondankaChallenge(){const C=CHARS.ondanka;
 const v=await modal({cls:'dark',title:'🌡️ 班のみんなで温暖化対策チャレンジ！',body:`<div class="charbig" style="font-size:80px">${C.i}</div><br>3問中2問正解で、オンダンカ神様をしずめられる！<br>成功すると、<b>発展度アップ＋全員に${fmt(E().base*2)}</b>！`,buttons:[{label:'🔥 班で挑戦する！',v:1},{label:'今回はやめておく',v:0,cls:'sub'}]});
 if(!v)return;const n=await test3(shuffle(WARM).slice(0,3),'温暖化対策チャレンジ');
 if(n>=2){G.chars=G.chars.filter(c=>c.k!=='ondanka');G.P.forEach(q=>q.money+=E().base*2);sfx('fan');fireworks(4);
  await modal({cls:'good',title:'オンダンカ神様が しずまった！',body:`<div class="charfly">${C.i}</div><br>班の全員に <b>+${fmt(E().base*2)}</b>！<p class="memo">${C.m}</p>`,buttons:[{label:'やったー！ ▶',v:1}]});await addDev(10,'みんなで温暖化に立ち向かった！');}
 else await modal({cls:'dark',title:`失敗…（${n}問正解）`,body:'オンダンカ神様はまだいる…。キャラクターマスに止まると、また挑戦できます。',buttons:[OK]});
 renderHud();renderSide();}

/* ===== ゴールと進行 ===== */
const RANKB=[1000,700,500,300,200,100,0];
async function goal(p){p.done=true;G.finished++;p.rank=G.finished;const b=Math.round(RANKB[p.rank-1]*(1+G.era*.5));p.money+=b;
 G.chars.filter(c=>c.h===G.cur).forEach(c=>{G.chars=G.chars.filter(x=>x!==c);});
 sfx('fan');fireworks(4);confetti(70);renderPawns();renderSide();floatMoney(b);
 await modal({icon:'<span class="trophy">🏆</span>',cls:'gold',title:`${esc(p.name)}さん、${p.rank}番目にゴール！`,body:`ゴールボーナス <b class="okc">+${fmt(b)}</b><br>仲間 ${p.mates}人・施設 ${p.props.length}件<p class="small">ほかの人がゴールするまで、応援しよう！ 班の発展度は、まだ上げられます。</p>`,buttons:[OK]});}
async function endTurn(){G.busy=false;
 if(G.P.every(q=>q.done))return finish();
 do{G.cur=(G.cur+1)%G.P.length;}while(G.P[G.cur].done);
 await turnStart();}

/* ===== 結果 ===== */
function postForm(url,data){const f=document.createElement('form');f.method='POST';f.action=url;f.target='_blank';f.acceptCharset='UTF-8';f.style.display='none';const i=document.createElement('input');i.type='hidden';i.name='payload';i.value=JSON.stringify(data);f.appendChild(i);document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500);}
const RFQ=[{k:'q1',min:30,q:'時代が進むにつれて、生物を育てる技術はどのように変わってきましたか。よくなったことと、新しく生まれた課題（環境・人手不足・温暖化など）の両方にふれて書きましょう。'},
 {k:'q2',min:30,q:'これからの「生物育成の技術」の学習で、自分が調べたいこと・挑戦したいことは何ですか。その理由も書きましょう。'}];
function finish(){const ranked=[...G.P].sort((a,b)=>assets(b)-assets(a)),avg=Math.round(G.P.reduce((a,p)=>a+assets(p),0)/G.P.length),bonus=G.era*1500+(G.era>=6?3000:0),score=avg+bonus,props=G.P.reduce((a,p)=>a+p.props.length,0);
 G.P.forEach(p=>{p.prank=ranked.indexOf(p)+1;p.rf=p.rf||{kumi:'',ban:'',name:/^プレイヤー\d$/.test(p.name)?'':p.name,q1:'',q2:''};});
 const opt=(n,v)=>`<option value="">選択</option>`+Array.from({length:n},(_,i)=>`<option ${String(i+1)===String(v)?'selected':''}>${i+1}</option>`).join('');
 app.innerHTML=`<div class="card hero"><div class="trophy">🏆</div><h2>表彰式</h2><p>たどり着いた時代：<b>${E().i} ${E().n}</b></p>
 <div class="etl">${ERAS.map((e,i)=>`<span style="${i<=G.era?'background:#ffe48a':''}">${e.i} ${e.n}</span>`).join('')}</div></div>
 <div class="card"><h2>👑 個人の順位（総資産＝お金＋施設の価値＋仲間）</h2><table><tr><th>順位</th><th>名前</th><th>総資産</th><th>お金</th><th>施設</th><th>仲間</th><th>ゴール</th></tr>
 ${ranked.map((p,i)=>`<tr><td><b>${['🥇','🥈','🥉'][i]||''} ${i+1}位</b></td><td>${esc(p.name)}</td><td><b>${fmt(assets(p))}</b></td><td>${fmt(p.money)}</td><td>${p.props.map(x=>`<span title="${esc(ERAS[x.era].n+'・'+x.n)}">${x.i}</span>`).join('')||'—'}</td><td>${p.mates}人</td><td>${p.rank}番目</td></tr>`).join('')}</table></div>
 <div class="card" style="text-align:center"><h2>🤝 班の得点</h2><div class="score">${fmt(score)}</div>
 <p>班員の平均資産 ${fmt(avg)} ＋ 時代ボーナス ${fmt(bonus)}（${E().n}まで発展${G.era>=6?'・現代到達ボーナス込み':''}）</p>
 <p>${G.era>=6?'🏆 <b>班の目標「令和の時代まで発展させる」を達成！</b>':`班の目標（平成・令和）まで、あと${6-G.era}つの時代でした。`}</p></div>
 <div class="card"><h2>⏳ 生物育成の歩み</h2><table><tr><th>時代</th><th>生物育成のようす</th></tr>${ERAS.map((e,i)=>`<tr style="${i>G.era?'opacity:.5':''}"><td>${e.i} <b>${e.n}</b><br><span class="small">${e.y}</span></td><td>${e.sum}</td></tr>`).join('')}</table></div>
 <div class="card qcard"><h2>✏️ ふりかえり（一人ずつ入力しよう）</h2><p>上の「生物育成の歩み」を見ながら、<b>自分の考え</b>を書きましょう。全員が入力したら、下のボタンで班まとめて提出します。</p>
 ${G.P.map((p,i)=>`<div class="rf" style="border-color:${p.color}"><div class="rfh"><span class="dot" style="background:${p.color}">${i+1}</span><b>${esc(p.name)}</b>さん<span class="small">（${p.prank}位）</span><span class="rfok" id="rfok${i}"></span></div>
  <div class="row"><label>組 <select data-p="${i}" data-k="kumi">${opt(8,p.rf.kumi)}</select></label><label>番号 <select data-p="${i}" data-k="ban">${opt(40,p.rf.ban)}</select></label><label>名前 <input data-p="${i}" data-k="name" value="${esc(p.rf.name)}" placeholder="本名（フルネーム）" maxlength="20"></label></div>
  ${RFQ.map((q,j)=>`<div class="rfq"><b>${j+1}．</b>${q.q}<textarea data-p="${i}" data-k="${q.k}" rows="3" maxlength="400" placeholder="${q.min}字以上で書こう">${esc(p.rf[q.k])}</textarea><div class="cnt" id="cnt${i}${q.k}"></div></div>`).join('')}</div>`).join('')}
 <div style="text-align:center;margin-top:10px"><div class="row" style="justify-content:center"><button id="send" class="big">📮 班の結果とふりかえりを提出する</button><button class="sub" id="rank">🏅 クラスの班ランキングを見る</button></div><p id="smsg" class="small"></p></div></div>
 <div class="row" style="justify-content:center;margin-bottom:20px"><button id="again" class="sub">⏳ 同じメンバーでもう一度</button><button class="sub" id="reset">設定にもどる</button></div>`;
 sfx('fan');confetti(100);fireworks(6);
 const check=i=>{const r=G.P[i].rf;RFQ.forEach(q=>{const n=r[q.k].replace(/\s/g,'').length,el=$('cnt'+i+q.k);el.textContent=`${n}字${n<q.min?`（あと${q.min-n}字）`:' ✅'}`;el.style.color=n<q.min?'#c0392b':'#1a8a4d';});
  const ok=r.kumi&&r.ban&&r.name&&RFQ.every(q=>r[q.k].replace(/\s/g,'').length>=q.min);$('rfok'+i).textContent=ok?'✅ 入力OK':'';return ok;};
 app.querySelectorAll('[data-p]').forEach(el=>{const h=()=>{G.P[+el.dataset.p].rf[el.dataset.k]=el.value.trim();check(+el.dataset.p);};el.oninput=h;el.onchange=h;});
 G.P.forEach((_,i)=>check(i));
 const kumiOf=()=>{const c={};G.P.forEach(p=>{if(p.rf.kumi)c[p.rf.kumi]=(c[p.rf.kumi]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'';};
 $('send').onclick=()=>{const ng=G.P.map((p,i)=>check(i)?'':p.name).filter(Boolean);
  if(ng.length){$('smsg').innerHTML=`<b class="ng">まだ入力が終わっていない人がいます：${ng.map(esc).join('、')}</b><br>組・番号・名前と、ふりかえり（各${RFQ[0].min}字以上）を入力してください。`;return;}
  const kumi=kumiOf();
  const payload={kind:'すごろく',kumi,han:G.P.map(p=>p.rf.name).join('・'),count:G.P.length,months:G.short?'ショート':'ノーマル',level:E().n,avgAssets:avg,groupScore:score,props,
   members:ranked.map((p,i)=>`${i+1}位 ${p.rf.name}（${fmt(assets(p))}）`).join(' ／ '),
   reflections:G.P.map(p=>({kumi:p.rf.kumi,ban:p.rf.ban,name:p.rf.name,player:p.name,rank:p.prank,assets:assets(p),level:E().n,q1:p.rf.q1,q2:p.rf.q2,group:G.P.map(q=>q.rf.name).join('・')}))};
  postForm(GAS_URL,payload);$('send').disabled=true;$('smsg').textContent='新しいタブで「✅ 提出できました」と出たら完了です。ログイン画面が出たら、学校のアカウントでログインしてからもう一度押してください。';setTimeout(()=>$('send').disabled=false,4000);};
 $('rank').onclick=()=>window.open(`${GAS_URL}?page=ranking&kumi=${encodeURIComponent(kumiOf())}`,'_blank');
 $('again').onclick=startGame;$('reset').onclick=renderSetup;window.scrollTo(0,0);}

renderSetup();
</script>
</body>
